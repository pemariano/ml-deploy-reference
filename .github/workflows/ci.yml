name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Lint shell scripts (shellcheck)
        run: shellcheck scripts/*.sh

      - name: Lint (ruff)
        run: make lint

      - name: Run tests with coverage
        run: make test

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Build & Smoke Test
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: make build

      - name: Start container
        run: docker run --rm -d -p 9000:8080 --name mlops-test mlops-model:latest

      - name: Wait for container to be ready
        run: |
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null -X POST \
              http://localhost:9000/2015-03-31/functions/function/invocations -d '{}'; then
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become ready in time." >&2
          docker logs mlops-test
          exit 1

      - name: Invoke handler (smoke test)
        run: make invoke | tee response.json

      - name: Assert response is 200 with a prediction
        run: jq -e '.statusCode == 200 and (.body | fromjson | has("prediction"))' response.json

      - name: Show container logs on failure
        if: failure()
        run: docker logs mlops-test

      - name: Stop container
        if: always()
        run: docker stop mlops-test

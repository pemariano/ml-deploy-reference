name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Lint (ruff)
        run: make lint

      - name: Run tests with coverage
        run: make test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  build:
    name: Build & Smoke Test
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: make build

      - name: Start container
        run: docker run --rm -d -p 9000:8080 --name mlops-test mlops-model:latest

      - name: Wait for container to be ready
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:9000/2015-03-31/functions/function/invocations \
              -d '{}' && break || sleep 1
          done

      - name: Invoke handler (smoke test)
        run: make invoke | tee response.json

      - name: Assert response contains predicao
        run: grep -q "predicao" response.json

      - name: Stop container
        if: always()
        run: docker stop mlops-test